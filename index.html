<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로마서 8장 암송 고시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 탭 4개(오늘·연습·모의고시·기록) + 720px 단일 열. 본문 말씀은 명조, 조작부는 고딕. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --ink:#17212b; --muted:#5a6978; --line:#d6dee6;
  --accent:#1d4f7c; --accent-ink:#ffffff; --accent-soft:#e3edf6;
  --ok:#2c7a57; --ok-soft:#e1f1e9; --warn:#a86a12; --warn-soft:#f8ecd6; --bad:#b03a3a; --bad-soft:#f8e3e3;
  --verse:"Noto Serif KR","Nanum Myeongjo",serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#18212a; --ink:#e5ebf1; --muted:#94a2b1; --line:#2b3743;
    --accent:#86b7e6; --accent-ink:#0f151b; --accent-soft:#1f3347;
    --ok:#6cc39a; --ok-soft:#183328; --warn:#e0b060; --warn-soft:#3a2e17; --bad:#ec8f8f; --bad-soft:#3d2020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e5ebf1; --muted:#94a2b1; --line:#2b3743;
  --accent:#86b7e6; --accent-ink:#0f151b; --accent-soft:#1f3347;
  --ok:#6cc39a; --ok-soft:#183328; --warn:#e0b060; --warn-soft:#3a2e17; --bad:#ec8f8f; --bad-soft:#3d2020;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 64px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--verse);font-size:22px;font-weight:600;margin:0}
.sync{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;font-weight:600;margin:0}
.card p{margin:0}
.card h3{font-size:14px;font-weight:600;margin:0;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.verse{font-family:var(--verse);font-size:19px;line-height:1.9;margin:0}
.ref{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;color:var(--accent);padding:8px 6px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
select,input[type=number],input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-family:var(--verse);font-size:17px;line-height:1.8;resize:vertical}
.map{display:grid;grid-template-columns:repeat(13,1fr);gap:5px}
@media (max-width:480px){.map{grid-template-columns:repeat(8,1fr)}}
.cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums;position:relative;background:transparent;cursor:pointer;padding:0}
.cell.b1{background:var(--accent-soft);border-color:var(--accent-soft)}
.cell.b2{background:color-mix(in srgb,var(--accent) 45%,var(--surface));border-color:transparent;color:var(--accent-ink)}
.cell.b3{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.cell.due::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.todo{border:1.5px dashed var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--verse);font-size:17px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer}
.chip.used{visibility:hidden}
.chip.no{border-color:var(--bad);background:var(--bad-soft)}
.built{min-height:64px;border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.blankline{font-family:var(--verse);font-size:18px;line-height:2.4}
.blankline input{font-family:var(--verse);font-size:17px;border:0;border-bottom:2px solid var(--accent);border-radius:0;background:var(--accent-soft);padding:2px 4px;text-align:center;margin:0 2px}
.blankline input.good{border-color:var(--ok);background:var(--ok-soft)}
.blankline input.miss{border-color:var(--bad);background:var(--bad-soft)}
.blankline .ans{color:var(--ok);font-size:14px;font-family:var(--ui);margin-right:4px}
.diff{font-family:var(--verse);font-size:17px;line-height:1.9;margin:0}
.diff .m{background:var(--bad-soft);color:var(--bad);text-decoration:underline;text-decoration-thickness:2px}
.diff .x{background:var(--warn-soft);color:var(--warn);text-decoration:line-through}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.q{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.q:first-of-type{border-top:0;padding-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center}
.day{border:1px solid var(--line);border-radius:6px;padding:4px 5px;min-height:46px;font-size:11px;display:flex;flex-direction:column;justify-content:space-between;color:var(--muted)}
.day b{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.day.out{visibility:hidden}
.day.done{background:var(--ok-soft);border-color:var(--ok)}
.day.missed{background:var(--warn-soft);border-color:var(--warn)}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}
.score{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.notice{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
@media (prefers-reduced-motion:no-preference){.chip.no{animation:shake .25s}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>로마서 8장 암송 고시</h1>
    <span class="sync" id="sync">저장 위치 확인 중</span>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#today">오늘</a><a href="#practice">연습</a><a href="#exam">모의고시</a><a href="#record">기록</a>
  </nav>
  <main id="view" class="wrap" style="padding:0"></main>
</div>
<script>
"use strict";
/* ---------- 본문 (기본: 개역한글) ---------- */
const DEFAULT_TRANSLATION = "개역한글";
const DEFAULT_VERSES = [
"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니",
"이는 그리스도 예수 안에 있는 생명의 성령의 법이 죄와 사망의 법에서 너를 해방하였음이라",
"율법이 육신으로 말미암아 연약하여 할 수 없는 그것을 하나님은 하시나니 곧 죄를 인하여 자기 아들을 죄 있는 육신의 모양으로 보내어 육신에 죄를 정하사",
"육신을 좇지 않고 그 영을 좇아 행하는 우리에게 율법의 요구를 이루어지게 하려 하심이니라",
"육신을 좇는 자는 육신의 일을, 영을 좇는 자는 영의 일을 생각하나니",
"육신의 생각은 사망이요 영의 생각은 생명과 평안이니라",
"육신의 생각은 하나님과 원수가 되나니 이는 하나님의 법에 굴복치 아니할뿐 아니라 할 수도 없음이라",
"육신에 있는 자들은 하나님을 기쁘시게 할 수 없느니라",
"만일 너희 속에 하나님의 영이 거하시면 너희가 육신에 있지 아니하고 영에 있나니 누구든지 그리스도의 영이 없으면 그리스도의 사람이 아니라",
"또 그리스도께서 너희 안에 계시면 몸은 죄로 인하여 죽은 것이나 영은 의를 인하여 산 것이니라",
"예수를 죽은 자 가운데서 살리신 이의 영이 너희 안에 거하시면 그리스도 예수를 죽은 자 가운데서 살리신 이가 너희 안에 거하시는 그의 영으로 말미암아 너희 죽을 몸도 살리시리라",
"그러므로 형제들아 우리가 빚진 자로되 육신에게 져서 육신대로 살 것이 아니니라",
"너희가 육신대로 살면 반드시 죽을 것이로되 영으로써 몸의 행실을 죽이면 살리니",
"무릇 하나님의 영으로 인도함을 받는 그들은 곧 하나님의 아들이라",
"너희는 다시 무서워하는 종의 영을 받지 아니하였고 양자의 영을 받았으므로 아바 아버지라 부르짖느니라",
"성령이 친히 우리 영으로 더불어 우리가 하나님의 자녀인 것을 증거하시나니",
"자녀이면 또한 후사 곧 하나님의 후사요 그리스도와 함께한 후사니 우리가 그와 함께 영광을 받기 위하여 고난도 함께 받아야 될 것이니라",
"생각건대 현재의 고난은 장차 우리에게 나타날 영광과 족히 비교할 수 없도다",
"피조물의 고대하는 바는 하나님의 아들들의 나타나는 것이니",
"피조물이 허무한데 굴복하는 것은 자기 뜻이 아니요 오직 굴복케 하시는 이로 말미암음이라",
"그 바라는 것은 피조물도 썩어짐의 종노릇 한데서 해방되어 하나님의 자녀들의 영광의 자유에 이르는 것이니라",
"피조물이 다 이제까지 함께 탄식하며 함께 고통하는 것을 우리가 아나니",
"이뿐 아니라 또한 우리 곧 성령의 처음 익은 열매를 받은 우리까지도 속으로 탄식하여 양자 될것 곧 우리 몸의 구속을 기다리느니라",
"우리가 소망으로 구원을 얻었으매 보이는 소망이 소망이 아니니 보는 것을 누가 바라리요",
"만일 우리가 보지 못하는 것을 바라면 참음으로 기다릴찌니라",
"이와 같이 성령도 우리 연약함을 도우시나니 우리가 마땅히 빌바를 알지 못하나 오직 성령이 말할 수 없는 탄식으로 우리를 위하여 친히 간구하시느니라",
"마음을 감찰하시는 이가 성령의 생각을 아시나니 이는 성령이 하나님의 뜻대로 성도를 위하여 간구하심이니라",
"우리가 알거니와 하나님을 사랑하는 자 곧 그 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라",
"하나님이 미리 아신 자들로 또한 그 아들의 형상을 본받게 하기 위하여 미리 정하셨으니 이는 그로 많은 형제 중에서 맏아들이 되게 하려 하심이니라",
"또 미리 정하신 그들을 또한 부르시고 부르신 그들을 또한 의롭다 하시고 의롭다 하신 그들을 또한 영화롭게 하셨느니라",
"그런즉 이 일에 대하여 우리가 무슨 말 하리요 만일 하나님이 우리를 위하시면 누가 우리를 대적하리요",
"자기 아들을 아끼지 아니하시고 우리 모든 사람을 위하여 내어주신 이가 어찌 그 아들과 함께 모든 것을 우리에게 은사로 주지 아니하시겠느뇨",
"누가 능히 하나님의 택하신 자들을 송사하리요 의롭다 하신 이는 하나님이시니",
"누가 정죄하리요 죽으실 뿐아니라 다시 살아나신 이는 그리스도 예수시니 그는 하나님 우편에 계신 자요 우리를 위하여 간구하시는 자시니라",
"누가 우리를 그리스도의 사랑에서 끊으리요 환난이나 곤고나 핍박이나 기근이나 적신이나 위험이나 칼이랴",
"기록된바 우리가 종일 주를 위하여 죽임을 당케 되며 도살할 양 같이 여김을 받았나이다 함과 같으니라",
"그러나 이 모든 일에 우리를 사랑하시는 이로 말미암아 우리가 넉넉히 이기느니라",
"내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 능력이나",
"높음이나 깊음이나 다른 아무 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라"
];
const N = 39;
const SECTIONS = [
  {from:1,to:4,name:"정죄함이 없음"},{from:5,to:8,name:"육신의 생각과 영의 생각"},
  {from:9,to:11,name:"우리 안에 거하시는 영"},{from:12,to:17,name:"하나님의 자녀"},
  {from:18,to:25,name:"고난과 소망"},{from:26,to:30,name:"성령의 간구와 부르심"},
  {from:31,to:39,name:"끊을 수 없는 사랑"}
];
const REVIEW_BLOCKS = [[1,11],[12,25],[26,39],[1,8],[9,17],[18,25],[26,30],[31,39]];
const INTERVAL = [0,1,2,4,7,14];
const PASS = 0.95, EXAM_PASS = 90;

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2,"0");
const fmt = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return fmt(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const today = () => fmt(new Date());
const DOW = ["일","월","화","수","목","금","토"];
const short = s => { const d = parse(s); return (d.getMonth()+1)+"/"+d.getDate()+"("+DOW[d.getDay()]+")"; };

/* ---------- 상태 ---------- */
const LS_KEY = "romans8-recite-v1";
function blank(){ return {v:1,updatedAt:0,start:"2026-11-26",end:"2027-01-31",translation:DEFAULT_TRANSLATION,verses:null,cards:{},log:{},exams:[]}; }
function migrate(s){ const b = blank(); if(!s||typeof s!=="object") return b;
  for(const k of Object.keys(b)) if(s[k]!==undefined && (s[k]!==null || k==="verses")) b[k] = s[k];
  if(!Array.isArray(b.verses)||b.verses.length!==N) b.verses = null;
  if(!Array.isArray(b.exams)) b.exams = [];
  if(typeof b.cards!=="object"||!b.cards) b.cards = {};
  if(typeof b.log!=="object"||!b.log) b.log = {};
  return b; }
let S = blank();
try{ const raw = localStorage.getItem(LS_KEY); if(raw) S = migrate(JSON.parse(raw)); }catch(e){}
let cloudRef = null, writing = false, dirty = false, saveTimer = null;
function setSync(t){ document.getElementById("sync").textContent = t; }
function save(){ S.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(cloudRef){ clearTimeout(saveTimer); saveTimer = setTimeout(pushCloud, 1200); } }
async function pushCloud(){ if(!cloudRef) return; if(writing){ dirty = true; return; }

const norm = s => s.replace(/[\s.,;:!?'"“”‘’·、。()\[\]\-~]/g,"");
function lcsMarks(a,b){ const n=a.length, m=b.length, W=m+1, T=new Uint16Array((n+1)*W);

  const r = lcsMarks(tk.map(x=>ta[x]), ik.map(x=>ia[x]));
  const acc = tk.length ? r.len/Math.max(tk.length, ik.length) : 0;
  const tm = new Uint8Array(ta.length).fill(1), im = new Uint8Array(ia.length).fill(1);
  tk.forEach((x,k)=>{ tm[x] = r.ma[k]; }); ik.forEach((x,k)=>{ im[x] = r.mb[k]; });
  return {acc, ta, ia, tm, im}; }

  const out = marks.map((k,x)=>raw.slice(k.e, x+1<N ? marks[x+1].s : raw.length).replace(/\s+/g," ").replace(/\s*(롬|로마서)\s*$/,"").trim());
